name: Testing

on: pull_request

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read            # needed for checkout
  packages: read            # needed for pulling from GHCR

env:
  # OPENFOAM_DIR: /opt/openfoam12
  BLASTFOAM_DIR: /opt/blastfoam

jobs:
  build:
    name: Build BlastFoam
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blastfoam-src
        shell: bash
    steps:
      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Build Tar for Cache
        #* This creates a cache tarball that can be used to skip builds
        #* in the next step if the files remain unchanged.
        run: |
          tar -czf checksum.tar.gz --mtime='UTC 2019-01-01' --group=0 --owner=0 \
            --numeric-owner --sort=name Makefile applications debian etc src

      - name: Check Cache
        #* Checks the cache tarball and only rebuilds if there were changes
        id: check-cache
        uses: actions/cache@v4
        with:
          path: blastfoam_*.deb
          key: ${{ hashFiles('blastfoam-src/checksum.tar.gz') }}
      
      - name: Install packaging and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            build-essential \
            fakeroot \
            lintian \
            debhelper \
            dh-make \
            quilt \
            equivs

      - name: Build BlastFoam package from makefile
        #* This builds the package from the makefile ONLY if the cache tarball is changed.
        if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
        run: |
          set -xo pipefail

          echo "Building BlastFoam package..."
          debuild --no-lintian -i -nc -us -uc -b --jobs=auto
        #* Debuild Flags
        #* --no-lintian: Do not run lintian on the package
        #* -i: Install the package
        #* -nc: Do not clean the build directory (this removes '.orig' files from tests)
        #* -us: Do not sign the package
        #* -uc: Do not sign the changes file
        #* -b: Build binary package
        #* --jobs=10: Run 10 jobs in parallel
      
      - name: Get package information
        if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
        id: package-info
        run: |
          PACKAGE_NAME=$(find . -maxdepth 1 -name "blastfoam_*.deb" | head -1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No .deb package found, build may have failed."
            exit 1
          fi
          echo "package-name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package built: $PACKAGE_NAME"

      - name: Output Debian Package
        if: ${{ steps.check-cache.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: blastfoam_*.deb
          retention-days: 31

  run-validation-tests:
    name: Validate ${{ matrix.solver }} on [${{ matrix.scenario_type }}] ${{ matrix.scenario_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: blastFoam
            scenario_type: validation
            scenario_name: rateStick
          - solver: blastFoam
            scenario_type: validation
            scenario_name: Sod_shockTube
          - solver: blastFoam
            scenario_type: validation
            scenario_name: solidImpact #* uses code templates
          - solver: blastFoam
            scenario_type: validation
            scenario_name: Sedov/Sedov_2D
          - solver: blastFoam
            scenario_type: validation
            scenario_name: Sedov/Sedov_3D
          - solver: blastFoam
            scenario_type: validation
            scenario_name: KingeryBulmash/KingeryBulmash_wedge
          - solver: blastEulerFoam
            scenario_type: validation
            scenario_name: shockTube_dilute
          - solver: blastEulerFoam
            scenario_type: validation
            scenario_name: shockTube_dense
          - solver: blastEulerFoam    
            scenario_type: validation
            scenario_name: shockTube_bidisperse
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: building3DWorkshop
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: delayedDetonation
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: movingCrane
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: shockTubeTabulated
          - solver: blastReactingFoam
            scenario_type: tutorial
            scenario_name: obliqueShock
          - solver: setRefinedFields
            scenario_type: tutorial
            scenario_name: .
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: ${{ github.workspace }}

      - name: Verify Package Downloaded
        run: |
          if ! ls blastfoam_*.deb 2>/dev/null; then
            echo "No .deb package found. Did the cache hit and skip the build?"
            exit 1
          fi

      - name: Install Debian Package
        run: |
          set -xo pipefail
          sudo dpkg -i blastfoam_*.deb
          # Verify installation
          dpkg -l | grep blastfoam || echo "Package not found in dpkg list"

      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Run ${{ matrix.solver }}
        shell: bash -l {0}
        run: |
          source $BLASTFOAM_DIR/etc/bashrc

          echo "SCENARIO_TYPE=${{ matrix.scenario_type }}" >> $GITHUB_ENV
          echo "SCENARIO=${{ matrix.scenario_name }}" >> $GITHUB_ENV
          echo "SOLVER=${{ matrix.solver }}" >> $GITHUB_ENV

          if [ "${{ matrix.scenario_type }}" = "validation" ]; then
            SCENARIO_PATH=./blastfoam-src/validation/${{ matrix.solver }}/${{ matrix.scenario_name }}
          else
            SCENARIO_PATH=./blastfoam-src/tutorials/${{ matrix.solver }}/${{ matrix.scenario_name }}
          fi

          chmod +x $SCENARIO_PATH/Allrun
          $SCENARIO_PATH/Allrun

      - name: Upload Validation Plots
        if: env.SCENARIO_TYPE == 'validation'
        uses: actions/upload-artifact@v4
        with:
          name: validation-plots
          path: blastfoam-src/validation/${{ env.SOLVER }}/${{ env.SCENARIO }}/validation/*.eps
          retention-days: 30

      - name: Uninstall Debian Package
        run: sudo dpkg -r blastfoam