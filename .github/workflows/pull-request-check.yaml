name: Testing

on: pull_request

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BLASTFOAM_DIR: /opt/blastfoam

jobs:
  build:
    name: Build BlastFoam
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blastfoam-src
        shell: bash
    steps:
      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Build Tar for Cache
        run: |
          tar -czf checksum.tar.gz --mtime='UTC 2019-01-01' --group=0 --owner=0 \
            --numeric-owner --sort=name Makefile applications debian etc src

      - name: Check Cache
        id: check-cache
        uses: actions/cache@v4
        with:
          path: blastfoam_*.deb
          key: ${{ hashFiles('blastfoam-src/checksum.tar.gz') }}

      - name: Install packaging and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            build-essential \
            fakeroot \
            lintian \
            debhelper \
            dh-make \
            quilt \
            equivs

      - name: Build BlastFoam package from makefile
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          set -xo pipefail

          export LD_LIBRARY_PATH=$BLASTFOAM_DIR/lib:$LD_LIBRARY_PATH

          echo "/opt/blastfoam/lib" | sudo tee /etc/ld.so.conf.d/blastfoam.conf
          sudo ldconfig

          echo "Building BlastFoam package..."
          debuild --no-lintian -i -nc -us -uc -b --jobs=auto

      - name: Get package information
        if: steps.check-cache.outputs.cache-hit != 'true'
        id: package-info
        run: |
          PACKAGE_NAME=$(find .. -maxdepth 1 -name "blastfoam_*.deb" | head -1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No .deb package found, build may have failed."
            exit 1
          fi
          echo "Found package: $PACKAGE_NAME"
          cp "$PACKAGE_NAME" ./  # copy to workspace
          echo "package-name=$(basename "$PACKAGE_NAME")" >> $GITHUB_OUTPUT

      - name: Upload Debian Package Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: blastfoam_*.deb
          retention-days: 31

