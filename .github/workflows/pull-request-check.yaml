name: Testing

on: pull_request

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BLASTFOAM_DIR: /opt/blastfoam

jobs:
  build:
    name: Build BlastFoam
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: blastfoam-src
        shell: bash
    steps:
      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Build Tar for Cache
        run: |
          tar -czf checksum.tar.gz --mtime='UTC 2019-01-01' --group=0 --owner=0 \
            --numeric-owner --sort=name Makefile applications debian etc src

      - name: Check Cache
        id: check-cache
        uses: actions/cache@v4
        with:
          path: blastfoam_*.deb
          key: ${{ hashFiles('blastfoam-src/checksum.tar.gz') }}

      - name: Install packaging and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            devscripts \
            build-essential \
            fakeroot \
            lintian \
            debhelper \
            dh-make \
            quilt \
            equivs

      - name: Build BlastFoam package from makefile
        if: steps.check-cache.outputs.cache-hit != 'true'
        run: |
          set -xo pipefail

          export LD_LIBRARY_PATH=$BLASTFOAM_DIR/lib:$LD_LIBRARY_PATH

          echo "/opt/blastfoam/lib" | sudo tee /etc/ld.so.conf.d/blastfoam.conf
          sudo ldconfig

          echo "Building BlastFoam package..."
          debuild --no-lintian -i -nc -us -uc -b --jobs=auto

      - name: Get package information
        if: steps.check-cache.outputs.cache-hit != 'true'
        id: package-info
        run: |
          PACKAGE_NAME=$(find .. -maxdepth 1 -name "blastfoam_*.deb" | head -1)
          if [ -z "$PACKAGE_NAME" ]; then
            echo "No .deb package found, build may have failed."
            exit 1
          fi
          echo "Found package: $PACKAGE_NAME"
          cp "$PACKAGE_NAME" ./  # copy to workspace
          echo "package-name=$(basename "$PACKAGE_NAME")" >> $GITHUB_OUTPUT

      - name: Upload Debian Package Artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: blastfoam_*.deb
          retention-days: 31

  run-validation-tests:
    name: Validate ${{ matrix.solver }} on [${{ matrix.scenario_type }}] ${{ matrix.scenario_name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: blastFoam
            scenario_type: validation
            scenario_name: rateStick
          - solver: blastFoam
            scenario_type: validation
            scenario_name: Sod_shockTube
          - solver: blastFoam
            scenario_type: validation
            scenario_name: solidImpact
          - solver: blastFoam
            scenario_type: validation
            scenario_name: Sedov/Sedov_2D
          - solver: blastFoam
            scenario_type: validation
            scenario_name: Sedov/Sedov_3D
          - solver: blastFoam
            scenario_type: validation
            scenario_name: KingeryBulmash/KingeryBulmash_wedge
          - solver: blastEulerFoam
            scenario_type: validation
            scenario_name: shockTube_dilute
          - solver: blastEulerFoam
            scenario_type: validation
            scenario_name: shockTube_dense
          - solver: blastEulerFoam    
            scenario_type: validation
            scenario_name: shockTube_bidisperse
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: building3DWorkshop
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: delayedDetonation
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: movingCone
          - solver: blastFoam
            scenario_type: tutorial
            scenario_name: shockTube_tabulated
          - solver: blastReactingFoam
            scenario_type: tutorial
            scenario_name: obliqueShock
          - solver: setRefinedFields
            scenario_type: tutorial
            scenario_name: setRefinedFields
    needs: build
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: ${{ github.workspace }}

      - name: Verify Package Downloaded
        run: |
          if ! ls blastfoam_*.deb 2>/dev/null; then
            echo "❌ No .deb package found. Validation tests cannot run without it."
            exit 1
          fi

      - name: Install Debian Package
        run: |
          set -xo pipefail
          sudo dpkg -i blastfoam_*.deb || true
          dpkg -l | grep blastfoam || echo "Package not found in dpkg list"

      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Set Environment Variables
        run: |
          echo "SCENARIO_TYPE=${{ matrix.scenario_type }}" >> $GITHUB_ENV
          echo "SCENARIO=${{ matrix.scenario_name }}" >> $GITHUB_ENV
          echo "SOLVER=${{ matrix.solver }}" >> $GITHUB_ENV
          echo "SAFE_SCENARIO=$(echo '${{ matrix.scenario_name }}' | tr '/' '_')" >> $GITHUB_ENV

      - name: Run ${{ matrix.solver }}
        id: run_solver
        shell: bash
        run: |
          source $BLASTFOAM_DIR/etc/bashrc

          if [ "$SCENARIO_TYPE" = "validation" ]; then
            SCENARIO_PATH=./blastfoam-src/validation/$SOLVER/$SCENARIO
          else
            SCENARIO_PATH=./blastfoam-src/tutorials/$SOLVER/$SCENARIO
          fi

          if [ ! -x "$SCENARIO_PATH/Allrun" ]; then
            echo "❌ Allrun script not found or not executable at $SCENARIO_PATH"
            exit 1
          fi

          chmod +x "$SCENARIO_PATH/Allrun"
          "$SCENARIO_PATH/Allrun"

      - name: Upload Logs if Failed
        if: steps.run_solver.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ env.SCENARIO_TYPE }}-${{ env.SOLVER }}-${{ env.SAFE_SCENARIO }}
          path: blastfoam-src/${{ env.SCENARIO_TYPE }}/${{ env.SOLVER }}/${{ env.SCENARIO }}/log.*
          retention-days: 30

      - name: Upload Validation Plots
        if: env.SCENARIO_TYPE == 'validation'
        uses: actions/upload-artifact@v4
        with:
          name: validation-plots-${{ env.SOLVER }}-${{ env.SAFE_SCENARIO }}
          path: blastfoam-src/validation/${{ env.SOLVER }}/${{ env.SCENARIO }}/validation/*.eps
          retention-days: 30

      - name: Uninstall Debian Package
        run: sudo dpkg -r blastfoam || echo "blastfoam package not found for removal"
