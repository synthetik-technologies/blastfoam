  validation-tests:
    name: Run Validation Scenarios Sequentially
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: ${{ github.workspace }}

      - name: Install Debian Package
        run: |
          set -xo pipefail
          sudo dpkg -i blastfoam_*.deb || true
          dpkg -l | grep blastfoam || echo "Package not found in dpkg list"

      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Run validation scenarios sequentially
        run: |
          source $BLASTFOAM_DIR/etc/bashrc

          scenarios=$(cat <<EOF
          blastFoam rateStick
          blastFoam Sod_shockTube
          blastFoam solidImpact
          blastFoam Sedov/Sedov_2D
          blastFoam Sedov/Sedov_3D
          blastFoam KingeryBulmash/KingeryBulmash_wedge
          blastEulerFoam shockTube_dilute
          blastEulerFoam shockTube_dense
          blastEulerFoam shockTube_bidisperse
          EOF
          )
          for line in $scenarios; do
            solver=$(echo $line | cut -d' ' -f1)
            name=$(echo $line | cut -d' ' -f2-)
            safe_name=$(echo "$name" | tr '/' '_')

            echo "🔹 Running $solver on validation $name"

            type="validation"
            path="./blastfoam-src/validation/$solver/$name"
            artifact_base="validation"            

            if [ ! -x "$path/Allrun" ]; then
              echo "❌ Missing Allrun: $path"
              continue
            fi

            chmod +x "$path/Allrun"
            if ! "$path/Allrun"; then
              echo "❌ Scenario failed: $name"

              # Attempt to upload logs
              echo "📤 Uploading logs for failed scenario: $name"
              log_dir="$path"
              mkdir -p tmp-logs/$safe_name
              cp "$log_dir"/log.* tmp-logs/$safe_name/ 2>/dev/null || echo "⚠️ No logs found for $name"
            fi


            mkdir -p tmp-validation-plots/$safe_name
            cp -v "$path"/validation/*.eps tmp-validation-plots/$safe_name/ 2>/dev/null || true
          done

      - name: Upload validation plots
        uses: actions/upload-artifact@v4
        with:
          name: validation-plots
          path: tmp-upload
          retention-days: 30
      
      - name: Upload failed validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-validation-logs
          path: tmp-logs
          retention-days: 7

  tutorial-tests:
    name: Run Tutorial Scenarios Sequentially
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Set up OpenFOAM 12
        uses: gerlero/setup-openfoam@v1
        with:
          openfoam-version: 12

      - name: Download Debian Package
        uses: actions/download-artifact@v4
        with:
          name: blastfoam_untested.deb
          path: ${{ github.workspace }}

      - name: Install Debian Package
        run: |
          set -xo pipefail
          sudo dpkg -i blastfoam_*.deb || true
          dpkg -l | grep blastfoam || echo "Package not found in dpkg list"

      - name: Checkout blastFOAM
        uses: actions/checkout@v4
        with:
          path: blastfoam-src

      - name: Run tutorial scenarios sequentially
        run: |
          source $BLASTFOAM_DIR/etc/bashrc

          scenarios=$(cat <<EOF
          blastFoam building3DWorkshop
          blastFoam delayedDetonation
          blastFoam movingCone
          blastFoam shockTube_tabulated
          blastReactingFoam obliqueShock
          setRefinedFields setRefinedFields
          EOF
          )

          for line in $scenarios; do
            solver=$(echo $line | cut -d' ' -f1)
            name=$(echo $line | cut -d' ' -f2-)
            safe_name=$(echo "$name" | tr '/' '_')

            echo "🔹 Running $solver on tutorial $name"

            type="tutorial"
            path="./blastfoam-src/tutorials/$solver/$name"
            artifact_base="tutorials"

            if [ ! -x "$path/Allrun" ]; then
              echo "❌ Missing Allrun: $path"
              continue
            fi

            chmod +x "$path/Allrun"
            if ! "$path/Allrun"; then
              echo "❌ Scenario failed: $name"

              # Attempt to upload logs
              echo "📤 Uploading logs for failed scenario: $name"
              log_dir="$path"
              mkdir -p tmp-logs/$safe_name
              cp "$log_dir"/log.* tmp-logs/$safe_name/ 2>/dev/null || echo "⚠️ No logs found for $name"
            fi
          done
      
      - name: Upload failed tutorial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tutorial-logs
          path: tmp-logs
          retention-days: 7
